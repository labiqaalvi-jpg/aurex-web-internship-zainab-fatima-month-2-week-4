<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Auth Section -->
        <div id="auth-section" class="card">
            <h2 id="form-title">Login</h2>
            <form id="auth-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="auth-btn">Login</button>
            </form>
            <p id="toggle-text">Don't have an account? <span id="toggle-link">Register</span></p>
        </div>

        <!-- Dashboard Section (Hidden by default) -->
        <div id="dashboard-section" class="card hidden">
            <div class="header">
                <h2>My Tasks</h2>
                <button id="logout-btn">Logout</button>
            </div>
            
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Task Title" required>
                <input type="text" id="task-desc" placeholder="Description">
                <button type="submit">Add Task</button>
            </form>

            <div id="task-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
